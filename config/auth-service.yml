# ==============================================================================
# Centralized Configuration: Auth Service (Port 9739)
# ==============================================================================

server:
  port: 9739

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/enrichment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:enrichment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:enrichment_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 60000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_auth
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:enrichment-platform-super-secret-jwt-signing-key-256-bits-minimum-required}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
