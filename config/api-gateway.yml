# ==============================================================================
# Centralized Configuration: API Gateway (Port 9738)
# ==============================================================================

server:
  port: 9738

gateway:
  security:
    api-key: ${GATEWAY_API_KEY:}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: research-service-sync
              uri: ${RESEARCH_SERVICE_URL:http://research-service:9741}
              predicates:
                - Path=/api/v1/research
            - id: research-service-jobs
              uri: ${RESEARCH_SERVICE_URL:http://research-service:9741}
              predicates:
                - Path=/api/v1/research/jobs/**
            - id: ai-service-v1
              uri: ${AI_INTELLIGENT_SERVICE_URL:http://ai-intelligent-service:9742}
              predicates:
                - Path=/api/v1/ai/**
            - id: ai-service-v2
              uri: ${AI_INTELLIGENT_SERVICE_URL:http://ai-intelligent-service:9742}
              predicates:
                - Path=/api/v2/ai/**
            - id: dataset-service-v2-datasets
              uri: ${DATASET_SERVICE_URL:http://dataset-service:9743}
              predicates:
                - Path=/api/v2/datasets/**
            - id: dataset-service-v1-enrichment
              uri: ${DATASET_SERVICE_URL:http://dataset-service:9743}
              predicates:
                - Path=/api/v1/enrichment/**
            - id: dataset-service-v1-entities
              uri: ${DATASET_SERVICE_URL:http://dataset-service:9743}
              predicates:
                - Path=/api/v1/entities/**
