# ==============================================================================
# Centralized Configuration: Dataset Service (Port 9743)
# ==============================================================================

server:
  port: 9743

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/enrichment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:enrichment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:enrichment_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        boot:
          allow_jdbc_metadata_access: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  health:
    db:
      enabled: false

services:
  research:
    url: ${RESEARCH_SERVICE_URL:http://research-service:9741}
  ai:
    url: ${AI_INTELLIGENT_SERVICE_URL:http://ai-intelligent-service:9742}

enrichment:
  execution:
    concurrency: ${ENRICHMENT_CONCURRENCY:3}
    queue-capacity: ${ENRICHMENT_QUEUE_CAPACITY:500}
  research:
    max-sources-per-entity: ${ENRICHMENT_MAX_SOURCES:5}
  timeout:
    entity-seconds: ${ENRICHMENT_ENTITY_TIMEOUT:60}
    job-minutes: ${ENRICHMENT_JOB_TIMEOUT:30}
  ai:
    enabled: ${ENRICHMENT_AI_ENABLED:true}
