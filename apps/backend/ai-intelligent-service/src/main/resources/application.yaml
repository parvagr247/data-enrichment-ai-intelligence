server:
  port: 9742

spring:
  application:
    name: ai-intelligent-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:9736}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9737/eureka/}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-key}
        chat:
          options:
            model: ${AI_MODEL:gemini-3.5-flash-lite}

ai:
  extraction:
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    temperature: 0.1
    mock-mode: ${AI_MOCK_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
