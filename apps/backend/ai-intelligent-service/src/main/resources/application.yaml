server:
  port: 9742

spring:
  application:
    name: ai-intelligent-service
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-key}
        chat:
          options:
            model: ${AI_MODEL:gemini-3.5-flash-lite}

ai:
  extraction:
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    temperature: 0.1
    mock-mode: ${AI_MOCK_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
