server:
  port: 9743

spring:
  application:
    name: dataset-service
  cloud:
    config:
      enabled: false
  config:
    import: optional:configserver:http://localhost:9736
  datasource:
    url: jdbc:mysql://localhost:3306/enrichment_db
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        boot:
          allow_jdbc_metadata_access: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: false
