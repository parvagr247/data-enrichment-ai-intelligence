server:
  port: 9741

spring:
  application:
    name: research-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

research:
  discovery:
    provider: ${SEARCH_PROVIDER_NAME:mock}
    api-key: ${SEARCH_PROVIDER_API_KEY:}
    base-url: ${SEARCH_PROVIDER_BASE_URL:https://api.tavily.com}
    max-results: ${SEARCH_DISCOVERY_MAX_RESULTS:5}
    timeout-ms: ${SEARCH_DISCOVERY_TIMEOUT_MS:4000}
  web-fetch:
    connect-timeout-ms: ${WEB_FETCH_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${WEB_FETCH_READ_TIMEOUT_MS:5000}
    max-response-size-mb: ${WEB_FETCH_MAX_RESPONSE_SIZE_MB:5}
  pipeline:
    max-sources: ${RESEARCH_MAX_SOURCES:5}
    max-content-length: ${RESEARCH_MAX_CONTENT_LENGTH:50000}
