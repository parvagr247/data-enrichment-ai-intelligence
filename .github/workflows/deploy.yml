name: Production Deployment to GCP VM

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-to-vm:
    name: Deploy to GCP Compute Engine VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keyscan \
            -p "${{ vars.GCP_VM_SSH_PORT || '22' }}" \
            -H "${{ vars.GCP_VM_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Deploy application to VM
        env:
          VM_USER: ${{ vars.GCP_VM_USER }}
          VM_HOST: ${{ vars.GCP_VM_HOST }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT || '22' }}
          VM_DIR: ${{ vars.GCP_VM_APP_DIR }}
        run: |
          echo "[INFO] Deploying to GCP VM..."
          echo "[INFO] Commit: $GITHUB_SHA"

          ssh \
            -i ~/.ssh/id_deploy \
            -p "${VM_PORT}" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_DIR}' && \
             git pull origin main && \
             chmod +x infrastructure/docker/deploy.sh && \
             cd infrastructure/docker && \
             ./deploy.sh"

      - name: Log deployment success
        if: success()
        run: |
          echo "======================================================================"
          echo " Production deployment succeeded!"
          echo " Git Commit SHA: $GITHUB_SHA"
          echo " Target Host:    ${{ vars.GCP_VM_HOST }}"
          echo "======================================================================"