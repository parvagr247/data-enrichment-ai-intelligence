services:
  mysql:
    image: mysql:latest
    container_name: enrichment-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enrichment_db}
      MYSQL_USER: ${MYSQL_USER:-enrichment_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enrichment_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enrichment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local

networks:
  enrichment-network:
    driver: bridge
