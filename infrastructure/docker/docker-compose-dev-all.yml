name: data-enrich-intell-project

services:
  mysql:
    image: mysql:latest
    container_name: enrichment-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enrichment_db}
      MYSQL_USER: ${MYSQL_USER:-enrichment_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enrichment_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enrichment-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  research-service:
    build:
      context: ../../apps/backend/research-service
      dockerfile: Dockerfile
    container_name: enrichment-research-service
    restart: unless-stopped
    ports:
      - "9741:9741"
    environment:
      SERVER_PORT: 9741
      SPRING_APPLICATION_NAME: research-service
      AI_INTELLIGENT_SERVICE_URL: http://ai-intelligent-service:9742
      DATASET_SERVICE_URL: http://dataset-service:9743
      SEARCH_PROVIDER_NAME: ${SEARCH_PROVIDER_NAME:-mock}
      SEARCH_PROVIDER_API_KEY: ${SEARCH_PROVIDER_API_KEY:-}
      SEARCH_PROVIDER_BASE_URL: ${SEARCH_PROVIDER_BASE_URL:-https://api.tavily.com}
      SEARCH_DISCOVERY_MAX_RESULTS: ${SEARCH_DISCOVERY_MAX_RESULTS:-5}
      SEARCH_DISCOVERY_TIMEOUT_MS: ${SEARCH_DISCOVERY_TIMEOUT_MS:-4000}
      WEB_FETCH_CONNECT_TIMEOUT_MS: ${WEB_FETCH_CONNECT_TIMEOUT_MS:-3000}
      WEB_FETCH_READ_TIMEOUT_MS: ${WEB_FETCH_READ_TIMEOUT_MS:-5000}
      WEB_FETCH_MAX_RESPONSE_SIZE_MB: ${WEB_FETCH_MAX_RESPONSE_SIZE_MB:-5}
      RESEARCH_MAX_SOURCES: ${RESEARCH_MAX_SOURCES:-5}
      RESEARCH_MAX_CONTENT_LENGTH: ${RESEARCH_MAX_CONTENT_LENGTH:-50000}
    volumes:
      - maven_cache:/root/.m2
      - ../../apps/backend/research-service/pom.xml:/app/pom.xml
      - ../../apps/backend/research-service/src:/app/src
    develop:
      watch:
        - path: ../../apps/backend/research-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/research-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/research-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  ai-intelligent-service:
    build:
      context: ../../apps/backend/ai-intelligent-service
      dockerfile: Dockerfile
    container_name: enrichment-ai-intelligent-service
    restart: unless-stopped
    ports:
      - "9742:9742"
    environment:
      SERVER_PORT: 9742
      SPRING_APPLICATION_NAME: ai-intelligent-service
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
    volumes:
      - maven_cache:/root/.m2
      - ../../apps/backend/ai-intelligent-service/pom.xml:/app/pom.xml
      - ../../apps/backend/ai-intelligent-service/src:/app/src
    develop:
      watch:
        - path: ../../apps/backend/ai-intelligent-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/ai-intelligent-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/ai-intelligent-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  dataset-service:
    build:
      context: ../../apps/backend/dataset-service
      dockerfile: Dockerfile
    container_name: enrichment-dataset-service
    restart: unless-stopped
    ports:
      - "9743:9743"
    environment:
      SERVER_PORT: 9743
      SPRING_APPLICATION_NAME: dataset-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-enrichment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-enrichment_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-enrichment_password}
      RESEARCH_SERVICE_URL: http://research-service:9741
      AI_INTELLIGENT_SERVICE_URL: http://ai-intelligent-service:9742
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - maven_cache:/root/.m2
      - ../../apps/backend/dataset-service/pom.xml:/app/pom.xml
      - ../../apps/backend/dataset-service/src:/app/src
    develop:
      watch:
        - path: ../../apps/backend/dataset-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/dataset-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/dataset-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: enrichment-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_RESEARCH_SERVICE_URL: ${NEXT_PUBLIC_RESEARCH_SERVICE_URL:-http://localhost:9741}
      NEXT_PUBLIC_AI_INTELLIGENT_SERVICE_URL: ${NEXT_PUBLIC_AI_INTELLIGENT_SERVICE_URL:-http://localhost:9742}
      NEXT_PUBLIC_DATASET_SERVICE_URL: ${NEXT_PUBLIC_DATASET_SERVICE_URL:-http://localhost:9743}
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - path: ../../apps/frontend/package.json
          action: rebuild
        - path: ../../apps/frontend/package-lock.json
          action: rebuild
        - path: ../../apps/frontend/Dockerfile
          action: rebuild
        - path: ../../apps/frontend/next.config.ts
          action: rebuild
        - path: ../../apps/frontend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
    networks:
      - enrichment-network

volumes:
  mysql_data:
    driver: local
  maven_cache:
    driver: local

networks:
  enrichment-network:
    driver: bridge
