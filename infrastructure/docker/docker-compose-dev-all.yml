name: data-enrich-intell-project

services:
  mysql:
    image: mysql:latest
    container_name: enrichment-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enrichment_db}
      MYSQL_USER: ${MYSQL_USER:-enrichment_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enrichment_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enrichment-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  config-server:
    build:
      context: ../../apps/backend/config-server
      dockerfile: Dockerfile
    container_name: enrichment-config-server
    restart: unless-stopped
    ports:
      - "9736:9736"
    environment:
      SERVER_PORT: 9736
      SPRING_PROFILES_ACTIVE: native
      CONFIG_SEARCH_LOCATIONS: file:/config
      EUREKA_SERVER_URL: http://discovery-server:9737/eureka/
    volumes:
      - maven_cache:/root/.m2
      - ../../config:/config:ro
    develop:
      watch:
        - path: ../../apps/backend/config-server/pom.xml
          action: rebuild
        - path: ../../apps/backend/config-server/Dockerfile
          action: rebuild
        - path: ../../apps/backend/config-server/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  discovery-server:
    build:
      context: ../../apps/backend/discovery-server
      dockerfile: Dockerfile
    container_name: enrichment-discovery-server
    restart: unless-stopped
    ports:
      - "9737:9737"
    environment:
      SERVER_PORT: 9737
      SPRING_APPLICATION_NAME: discovery-server
      CONFIG_SERVER_URL: http://config-server:9736
    volumes:
      - maven_cache:/root/.m2
    develop:
      watch:
        - path: ../../apps/backend/discovery-server/pom.xml
          action: rebuild
        - path: ../../apps/backend/discovery-server/Dockerfile
          action: rebuild
        - path: ../../apps/backend/discovery-server/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  api-gateway:
    build:
      context: ../../apps/backend/api-gateway
      dockerfile: Dockerfile
    container_name: enrichment-api-gateway
    restart: unless-stopped
    ports:
      - "9738:9738"
    environment:
      SERVER_PORT: 9738
      SPRING_APPLICATION_NAME: api-gateway
      CONFIG_SERVER_URL: http://config-server:9736
      EUREKA_SERVER_URL: http://discovery-server:9737/eureka/
      RESEARCH_SERVICE_URL: http://research-service:9741
      AI_INTELLIGENT_SERVICE_URL: http://ai-intelligent-service:9742
      DATASET_SERVICE_URL: http://dataset-service:9743
      AUTH_SERVICE_URL: http://auth-service:9739
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - maven_cache:/root/.m2
    develop:
      watch:
        - path: ../../apps/backend/api-gateway/pom.xml
          action: rebuild
        - path: ../../apps/backend/api-gateway/Dockerfile
          action: rebuild
        - path: ../../apps/backend/api-gateway/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  auth-service:
    build:
      context: ../../apps/backend/auth-service
      dockerfile: Dockerfile
    container_name: enrichment-auth-service
    restart: unless-stopped
    ports:
      - "9739:9739"
    environment:
      SERVER_PORT: 9739
      SPRING_APPLICATION_NAME: auth-service
      CONFIG_SERVER_URL: http://config-server:9736
      EUREKA_SERVER_URL: http://discovery-server:9737/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-enrichment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-enrichment_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-enrichment_password}
      JWT_SECRET: ${JWT_SECRET:-enrichment-platform-super-secret-jwt-signing-key-256-bits-minimum-required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - maven_cache:/root/.m2
    develop:
      watch:
        - path: ../../apps/backend/auth-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/auth-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/auth-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  research-service:
    build:
      context: ../../apps/backend/research-service
      dockerfile: Dockerfile
    container_name: enrichment-research-service
    restart: unless-stopped
    ports:
      - "9741:9741"
    environment:
      SERVER_PORT: 9741
      SPRING_APPLICATION_NAME: research-service
      CONFIG_SERVER_URL: http://config-server:9736
      EUREKA_SERVER_URL: http://discovery-server:9737/eureka/
      AI_INTELLIGENT_SERVICE_URL: http://ai-intelligent-service:9742
      DATASET_SERVICE_URL: http://dataset-service:9743
      SEARCH_PROVIDER_NAME: ${SEARCH_PROVIDER_NAME:-mock}
      SEARCH_PROVIDER_API_KEY: ${SEARCH_PROVIDER_API_KEY:-}
      SEARCH_PROVIDER_BASE_URL: ${SEARCH_PROVIDER_BASE_URL:-https://api.tavily.com}
      SEARCH_DISCOVERY_MAX_RESULTS: ${SEARCH_DISCOVERY_MAX_RESULTS:-5}
      SEARCH_DISCOVERY_TIMEOUT_MS: ${SEARCH_DISCOVERY_TIMEOUT_MS:-4000}
      WEB_FETCH_CONNECT_TIMEOUT_MS: ${WEB_FETCH_CONNECT_TIMEOUT_MS:-3000}
      WEB_FETCH_READ_TIMEOUT_MS: ${WEB_FETCH_READ_TIMEOUT_MS:-5000}
      WEB_FETCH_MAX_RESPONSE_SIZE_MB: ${WEB_FETCH_MAX_RESPONSE_SIZE_MB:-5}
      RESEARCH_MAX_SOURCES: ${RESEARCH_MAX_SOURCES:-5}
      RESEARCH_MAX_CONTENT_LENGTH: ${RESEARCH_MAX_CONTENT_LENGTH:-50000}
    volumes:
      - maven_cache:/root/.m2
    develop:
      watch:
        - path: ../../apps/backend/research-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/research-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/research-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  ai-intelligent-service:
    build:
      context: ../../apps/backend/ai-intelligent-service
      dockerfile: Dockerfile
    container_name: enrichment-ai-intelligent-service
    restart: unless-stopped
    ports:
      - "9742:9742"
    environment:
      SERVER_PORT: 9742
      SPRING_APPLICATION_NAME: ai-intelligent-service
      CONFIG_SERVER_URL: http://config-server:9736
      EUREKA_SERVER_URL: http://discovery-server:9737/eureka/
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - maven_cache:/root/.m2
    develop:
      watch:
        - path: ../../apps/backend/ai-intelligent-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/ai-intelligent-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/ai-intelligent-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  dataset-service:
    build:
      context: ../../apps/backend/dataset-service
      dockerfile: Dockerfile
    container_name: enrichment-dataset-service
    restart: unless-stopped
    ports:
      - "9743:9743"
    environment:
      SERVER_PORT: 9743
      SPRING_APPLICATION_NAME: dataset-service
      CONFIG_SERVER_URL: http://config-server:9736
      EUREKA_SERVER_URL: http://discovery-server:9737/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-enrichment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-enrichment_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-enrichment_password}
      RESEARCH_SERVICE_URL: http://research-service:9741
      AI_INTELLIGENT_SERVICE_URL: http://ai-intelligent-service:9742
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - maven_cache:/root/.m2
    develop:
      watch:
        - path: ../../apps/backend/dataset-service/pom.xml
          action: rebuild
        - path: ../../apps/backend/dataset-service/Dockerfile
          action: rebuild
        - path: ../../apps/backend/dataset-service/src
          target: /app/src
          action: sync+restart
    networks:
      - enrichment-network

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: enrichment-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:9738}
      NEXT_PUBLIC_RESEARCH_SERVICE_URL: ${NEXT_PUBLIC_RESEARCH_SERVICE_URL:-http://localhost:9738}
      NEXT_PUBLIC_AI_INTELLIGENT_SERVICE_URL: ${NEXT_PUBLIC_AI_INTELLIGENT_SERVICE_URL:-http://localhost:9738}
      NEXT_PUBLIC_DATASET_SERVICE_URL: ${NEXT_PUBLIC_DATASET_SERVICE_URL:-http://localhost:9738}
      NEXT_PUBLIC_AUTH_SERVICE_URL: ${NEXT_PUBLIC_AUTH_SERVICE_URL:-http://localhost:9738}
      NEXT_PUBLIC_GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
    volumes:
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - path: ../../apps/frontend/package.json
          action: rebuild
        - path: ../../apps/frontend/package-lock.json
          action: rebuild
        - path: ../../apps/frontend/Dockerfile
          action: rebuild
        - path: ../../apps/frontend/next.config.ts
          action: rebuild
        - path: ../../apps/frontend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
    networks:
      - enrichment-network

volumes:
  mysql_data:
    driver: local
  maven_cache:
    driver: local

networks:
  enrichment-network:
    driver: bridge
